<svg viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="zaid-grad-fav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="zaid-accent-fav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="dot-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- High-contrast Premium Background Squircle -->
  <rect x="1.5" y="1.5" width="41" height="41" rx="11" fill="#0a0d14" stroke="url(#zaid-grad-fav)" stroke-width="2.2" />
  <rect x="2.5" y="2.5" width="39" height="39" rx="10" fill="url(#zaid-grad-fav)" fill-opacity="0.18" />

  <!-- Monogram Z for Zaid -->
  <path d="M12 15H21L13 29H22" stroke="url(#zaid-grad-fav)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Monogram A for Ahmad -->
  <path d="M22.5 29L27.5 15L32.5 29" stroke="url(#zaid-accent-fav)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M24.8 24.5H30.2" stroke="url(#zaid-accent-fav)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Glowing Cyan Tech Dot -->
  <circle cx="32.5" cy="15" r="2.4" fill="#06b6d4" filter="url(#dot-glow)" />
</svg>
